name: Create release and deploy FluMut
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v.*"

  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true


jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install FluMut with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(grep -oP "__version__\s*=\s*['\"]\K[^'\"]+" src/flumut/__init__.py)
          TAG="${GITHUB_REF_NAME#v.}"
          echo "Package version: $VERSION"
          echo "Git tag: $GITHUB_REF_NAME (stripped: $TAG)"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Git tag '$GITHUB_REF_NAME' does not match package version '$VERSION' (expected tag 'v.$VERSION')"
            exit 1
          fi
      - name: Run tests
        run: pytest


  build:
    name: Build FluMut
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build FluMut
        run: python -m build
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist
          if-no-files-found: error


  executables:
    name: Create executables
    needs: test
    permissions:
      contents: read

    strategy:
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install ".[gui]"
      - name: Build with Pyinstaller
        run: |
          # PyInstaller's splash screen is not supported on macOS
          splash=(--splash docs/images/flumut_splash.png)
          if [ "$RUNNER_OS" == "macOS" ]; then
            splash=()
            pip install pillow
          fi
          python -m PyInstaller ./src/flumut/gui/__main__.py \
            --name FluMutGUI-$RUNNER_OS \
            --icon src/flumut/gui/resources/flumut_icon.ico \
            --add-data src/flumut/data/:flumut/data/ \
            --add-data src/flumut/gui/resources/:flumut/gui/resources \
            "${splash[@]}" \
            --clean --noconfirm -w --onefile
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: executable-${{ runner.os }}
          path: dist/
          if-no-files-found: error


  examples:
    name: Create FluMut examples files
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install FluMut
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run FluMut
        run: | 
          mv examples/multiple_samples.fa examples/fasta_input_example.fa
          flumut -x examples/excel_output_example.xlsm examples/fasta_input_example.fa
      - name: Upload examples
        uses: actions/upload-artifact@v7
        with:
          name: examples
          path: |
            examples/excel_output_example.xlsm
            examples/fasta_input_example.fa
          if-no-files-found: error


  release:
    name: Create release on GitHub
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    needs: [build, executables, examples]

    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: dist
      - name: Download executables
        uses: actions/download-artifact@v8
        with:
          pattern: executable-*
          path: dist
          merge-multiple: true
      - name: Download examples
        uses: actions/download-artifact@v8
        with:
          name: examples
          path: examples
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            examples/excel_output_example.xlsm
            examples/fasta_input_example.fa
            dist/*


  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
    environment: pypi-release
    needs: release

    steps:
    - name: Download dist artifact
      uses: actions/download-artifact@v8
      with:
        name: build
        path: dist
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
