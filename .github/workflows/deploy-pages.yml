# Builds the Jekyll documentation site and publishes it to GitHub Pages.
#
# The markers table is generated from the database bundled in this repository.
# It used to be downloaded from the FluMutDB releases, which no longer exist:
# the database now ships inside the FluMut package.
name: Deploy FluMut site

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - "src/flumut/data/flumut_db.sqlite"
      - "scripts/create_markers_markdown.py"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/flumut/data/flumut_db.sqlite"
      - "scripts/create_markers_markdown.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cache-version: 0
          working-directory: "${{ github.workspace }}/docs"
      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Create markers table
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          pip install .
          python scripts/create_markers_markdown.py
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "docs/_site/"

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
